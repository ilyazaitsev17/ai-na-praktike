<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

  <rect width="1200" height="760" fill="#0d1117"/>

  <text x="600" y="64" text-anchor="middle" font-size="40" font-weight="800" fill="#e6edf3">
    Архитектура трансформера
  </text>
  <text x="600" y="100" text-anchor="middle" font-size="17" font-weight="400" fill="#8b949e">
    encoder понимает · decoder генерирует
  </text>

  <!-- ========== ENCODER (левая часть) ========== -->
  <g transform="translate(60, 150)">
    <rect x="0" y="0" width="460" height="500" rx="20" ry="20"
          fill="#161b22" stroke="#26D9C9" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="500" fill="#26D9C9"/>

    <text x="230" y="50" text-anchor="middle" font-size="28" font-weight="800" fill="#26D9C9">
      ENCODER
    </text>
    <text x="230" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#8b949e">
      кодировщик · понимает входной текст
    </text>

    <!-- Поток данных -->
    <!-- Вход -->
    <g transform="translate(110, 110)">
      <rect x="0" y="0" width="240" height="44" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
      <text x="120" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">My teddy bear is reading</text>
    </g>

    <g transform="translate(225, 170)">
      <line x1="0" y1="0" x2="0" y2="26" stroke="#26D9C9" stroke-width="2.5"/>
      <polyline points="-7,18 0,28 7,18" fill="none" stroke="#26D9C9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Токены -->
    <g transform="translate(60, 210)">
      <rect x="0" y="0" width="68" height="36" rx="8" ry="8" fill="#0d1117" stroke="#26D9C9" stroke-width="1"/>
      <text x="34" y="23" text-anchor="middle" font-size="12" font-weight="600" fill="#e6edf3">My</text>

      <rect x="76" y="0" width="68" height="36" rx="8" ry="8" fill="#0d1117" stroke="#26D9C9" stroke-width="1"/>
      <text x="110" y="23" text-anchor="middle" font-size="12" font-weight="600" fill="#e6edf3">teddy</text>

      <rect x="152" y="0" width="68" height="36" rx="8" ry="8" fill="#0d1117" stroke="#26D9C9" stroke-width="1"/>
      <text x="186" y="23" text-anchor="middle" font-size="12" font-weight="600" fill="#e6edf3">bear</text>

      <rect x="228" y="0" width="48" height="36" rx="8" ry="8" fill="#0d1117" stroke="#26D9C9" stroke-width="1"/>
      <text x="252" y="23" text-anchor="middle" font-size="12" font-weight="600" fill="#e6edf3">is</text>

      <rect x="284" y="0" width="88" height="36" rx="8" ry="8" fill="#0d1117" stroke="#26D9C9" stroke-width="1"/>
      <text x="328" y="23" text-anchor="middle" font-size="12" font-weight="600" fill="#e6edf3">reading</text>
    </g>

    <g transform="translate(225, 260)">
      <line x1="0" y1="0" x2="0" y2="26" stroke="#26D9C9" stroke-width="2.5"/>
      <polyline points="-7,18 0,28 7,18" fill="none" stroke="#26D9C9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Слои attention (стек) -->
    <g transform="translate(110, 300)">
      <rect x="0" y="0" width="240" height="50" rx="10" ry="10" fill="#26D9C9" opacity="0.15" stroke="#26D9C9" stroke-width="1.5"/>
      <text x="120" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#26D9C9">слой attention №1</text>

      <rect x="0" y="56" width="240" height="50" rx="10" ry="10" fill="#26D9C9" opacity="0.3" stroke="#26D9C9" stroke-width="1.5"/>
      <text x="120" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#26D9C9">слой attention №2</text>

      <rect x="0" y="112" width="240" height="50" rx="10" ry="10" fill="#26D9C9" opacity="0.55" stroke="#26D9C9" stroke-width="1.5"/>
      <text x="120" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#26D9C9">слой attention №N</text>
    </g>

    <!-- Подпись внизу -->
    <line x1="30" y1="465" x2="430" y2="465" stroke="#30363d" stroke-width="1"/>
    <text x="230" y="490" text-anchor="middle" font-size="13" font-weight="600" fill="#26D9C9" opacity="0.8">
      На выходе: контекст всего предложения
    </text>
  </g>

  <!-- ========== СТРЕЛКА МЕЖДУ encoder и decoder ========== -->
  <g transform="translate(545, 380)">
    <line x1="0" y1="20" x2="80" y2="20" stroke="#e6edf3" stroke-width="3" stroke-opacity="0.4"/>
    <polyline points="68,10 82,20 68,30" fill="none" stroke="#e6edf3" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="55" text-anchor="middle" font-size="12" font-weight="600" fill="#8b949e">контекст</text>
  </g>

  <!-- ========== DECODER (правая часть) ========== -->
  <g transform="translate(680, 150)">
    <rect x="0" y="0" width="460" height="500" rx="20" ry="20"
          fill="#161b22" stroke="#56d364" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="500" fill="#56d364"/>

    <text x="230" y="50" text-anchor="middle" font-size="28" font-weight="800" fill="#56d364">
      DECODER
    </text>
    <text x="230" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#8b949e">
      декодировщик · генерирует ответ по одному токену
    </text>

    <!-- Стек слоёв -->
    <g transform="translate(110, 110)">
      <rect x="0" y="0" width="240" height="50" rx="10" ry="10" fill="#56d364" opacity="0.15" stroke="#56d364" stroke-width="1.5"/>
      <text x="120" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#56d364">слой attention №1</text>

      <rect x="0" y="56" width="240" height="50" rx="10" ry="10" fill="#56d364" opacity="0.3" stroke="#56d364" stroke-width="1.5"/>
      <text x="120" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#56d364">слой attention №2</text>

      <rect x="0" y="112" width="240" height="50" rx="10" ry="10" fill="#56d364" opacity="0.55" stroke="#56d364" stroke-width="1.5"/>
      <text x="120" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#56d364">слой attention №N</text>
    </g>

    <g transform="translate(225, 280)">
      <line x1="0" y1="0" x2="0" y2="26" stroke="#56d364" stroke-width="2.5"/>
      <polyline points="-7,18 0,28 7,18" fill="none" stroke="#56d364" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Генерация по токену -->
    <g transform="translate(60, 320)">
      <rect x="0" y="0" width="56" height="36" rx="8" ry="8" fill="#56d364"/>
      <text x="28" y="23" text-anchor="middle" font-size="12" font-weight="800" fill="#0d1117">мой</text>

      <rect x="64" y="0" width="92" height="36" rx="8" ry="8" fill="#56d364"/>
      <text x="110" y="23" text-anchor="middle" font-size="12" font-weight="800" fill="#0d1117">плюшевый</text>

      <rect x="164" y="0" width="74" height="36" rx="8" ry="8" fill="#56d364"/>
      <text x="201" y="23" text-anchor="middle" font-size="12" font-weight="800" fill="#0d1117">мишка</text>

      <rect x="246" y="0" width="64" height="36" rx="8" ry="8" fill="#56d364"/>
      <text x="278" y="23" text-anchor="middle" font-size="12" font-weight="800" fill="#0d1117">читает</text>

      <rect x="318" y="0" width="48" height="36" rx="8" ry="8" fill="#56d364" opacity="0.4" stroke="#56d364" stroke-width="1.5"/>
      <text x="342" y="23" text-anchor="middle" font-size="14" font-weight="800" fill="#56d364">…</text>
    </g>

    <text x="230" y="395" text-anchor="middle" font-size="12" font-weight="500" fill="#8b949e">
      слово за словом — пока не выдаст «конец»
    </text>

    <line x1="30" y1="465" x2="430" y2="465" stroke="#30363d" stroke-width="1"/>
    <text x="230" y="490" text-anchor="middle" font-size="13" font-weight="600" fill="#56d364" opacity="0.8">
      Все современные LLM используют только decoder
    </text>
  </g>

  <!-- ========== Нижняя плашка ========== -->
  <g transform="translate(60, 680)">
    <rect x="0" y="0" width="1080" height="56" rx="14" ry="14"
          fill="#0d1117" stroke="#f0883e" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="56" fill="#f0883e"/>

    <text x="540" y="34" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">
      ⚡ ChatGPT, Claude, Gemini, LLaMA, DeepSeek, Mistral — все decoder-only трансформеры. Encoder в чатах не нужен.
    </text>
  </g>

</svg>
