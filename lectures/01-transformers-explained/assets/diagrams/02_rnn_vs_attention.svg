<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

  <rect width="1200" height="720" fill="#0d1117"/>

  <text x="600" y="64" text-anchor="middle" font-size="40" font-weight="800" fill="#e6edf3">
    RNN против Attention
  </text>
  <text x="600" y="100" text-anchor="middle" font-size="17" font-weight="400" fill="#8b949e">
    что изменилось в 2017 году когда переписали всё с нуля
  </text>

  <!-- ========== LEFT: RNN ========== -->
  <g transform="translate(40, 150)">
    <rect x="0" y="0" width="540" height="520" rx="20" ry="20"
          fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="520" fill="#f0883e"/>

    <text x="270" y="60" text-anchor="middle" font-size="26" font-weight="800" fill="#f0883e">
      RNN — старый способ
    </text>
    <text x="270" y="92" text-anchor="middle" font-size="14" font-weight="500" fill="#8b949e">
      слово за словом, по цепочке через память
    </text>

    <!-- Цепочка слов с скрытым состоянием -->
    <g transform="translate(40, 140)">
      <!-- 4 слова в цепочке -->
      <g>
        <rect x="0" y="20" width="100" height="46" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
        <text x="50" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">мама</text>
      </g>
      <g>
        <rect x="120" y="20" width="100" height="46" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
        <text x="170" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">мыла</text>
      </g>
      <g>
        <rect x="240" y="20" width="100" height="46" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
        <text x="290" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">раму</text>
      </g>
      <g>
        <rect x="360" y="20" width="100" height="46" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
        <text x="410" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">…</text>
      </g>

      <!-- Стрелки между словами — последовательно -->
      <g stroke="#f0883e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="100" y1="43" x2="115" y2="43"/>
        <polyline points="110,38 118,43 110,48"/>
        <line x1="220" y1="43" x2="235" y2="43"/>
        <polyline points="230,38 238,43 230,48"/>
        <line x1="340" y1="43" x2="355" y2="43"/>
        <polyline points="350,38 358,43 350,48"/>
      </g>

      <!-- Скрытое состояние снизу — память -->
      <g transform="translate(0, 90)">
        <rect x="0" y="0" width="100" height="36" rx="8" ry="8" fill="#f0883e" opacity="0.2" stroke="#f0883e" stroke-width="1"/>
        <text x="50" y="23" text-anchor="middle" font-size="11" font-weight="600" fill="#f0883e">память</text>

        <rect x="120" y="0" width="100" height="36" rx="8" ry="8" fill="#f0883e" opacity="0.35" stroke="#f0883e" stroke-width="1"/>
        <text x="170" y="23" text-anchor="middle" font-size="11" font-weight="600" fill="#f0883e">+ мама</text>

        <rect x="240" y="0" width="100" height="36" rx="8" ry="8" fill="#f0883e" opacity="0.55" stroke="#f0883e" stroke-width="1"/>
        <text x="290" y="23" text-anchor="middle" font-size="11" font-weight="600" fill="#f0883e">+ мыла</text>

        <rect x="360" y="0" width="100" height="36" rx="8" ry="8" fill="#f0883e" opacity="0.8" stroke="#f0883e" stroke-width="1"/>
        <text x="410" y="23" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1117">+ раму</text>
      </g>

      <!-- Соединяющие линии от слов к памяти -->
      <g stroke="#f0883e" stroke-width="1" opacity="0.4">
        <line x1="50" y1="66" x2="50" y2="90"/>
        <line x1="170" y1="66" x2="170" y2="90"/>
        <line x1="290" y1="66" x2="290" y2="90"/>
        <line x1="410" y1="66" x2="410" y2="90"/>
      </g>
    </g>

    <!-- Минусы -->
    <g transform="translate(40, 320)">
      <text x="0" y="0" font-size="14" font-weight="700" fill="#e6edf3">Минусы:</text>

      <g transform="translate(0, 24)">
        <circle cx="6" cy="6" r="3" fill="#f0883e"/>
        <text x="20" y="11" font-size="13" font-weight="500" fill="#8b949e">забывает начало длинных текстов</text>
      </g>
      <g transform="translate(0, 48)">
        <circle cx="6" cy="6" r="3" fill="#f0883e"/>
        <text x="20" y="11" font-size="13" font-weight="500" fill="#8b949e">обрабатывает по очереди — медленно</text>
      </g>
      <g transform="translate(0, 72)">
        <circle cx="6" cy="6" r="3" fill="#f0883e"/>
        <text x="20" y="11" font-size="13" font-weight="500" fill="#8b949e">видеокарты простаивают</text>
      </g>
    </g>

    <line x1="30" y1="465" x2="510" y2="465" stroke="#30363d" stroke-width="1"/>
    <text x="270" y="492" text-anchor="middle" font-size="13" font-weight="600" fill="#f0883e" opacity="0.8">
      Испорченный телефон: к десятому смысл потерян
    </text>
  </g>

  <!-- ========== RIGHT: Attention ========== -->
  <g transform="translate(620, 150)">
    <rect x="0" y="0" width="540" height="520" rx="20" ry="20"
          fill="#161b22" stroke="#26D9C9" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="520" fill="#26D9C9"/>

    <text x="270" y="60" text-anchor="middle" font-size="26" font-weight="800" fill="#26D9C9">
      Attention — новый способ
    </text>
    <text x="270" y="92" text-anchor="middle" font-size="14" font-weight="500" fill="#8b949e">
      каждое слово видит каждое — напрямую, параллельно
    </text>

    <!-- Слова в ряд + полносвязные стрелки -->
    <g transform="translate(40, 140)">
      <!-- 4 слова -->
      <g>
        <rect x="0" y="20" width="100" height="46" rx="10" ry="10" fill="#0d1117" stroke="#26D9C9" stroke-width="1.5"/>
        <text x="50" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">мама</text>
      </g>
      <g>
        <rect x="120" y="20" width="100" height="46" rx="10" ry="10" fill="#0d1117" stroke="#26D9C9" stroke-width="1.5"/>
        <text x="170" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">мыла</text>
      </g>
      <g>
        <rect x="240" y="20" width="100" height="46" rx="10" ry="10" fill="#0d1117" stroke="#26D9C9" stroke-width="1.5"/>
        <text x="290" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">раму</text>
      </g>
      <g>
        <rect x="360" y="20" width="100" height="46" rx="10" ry="10" fill="#0d1117" stroke="#26D9C9" stroke-width="1.5"/>
        <text x="410" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">…</text>
      </g>

      <!-- Полносвязная сеть стрелок между всеми словами -->
      <g stroke="#26D9C9" stroke-width="1.2" fill="none" opacity="0.5">
        <!-- Дуги соединяющие все пары -->
        <path d="M 50 20 Q 110 -10 170 20" />
        <path d="M 50 20 Q 170 -25 290 20" />
        <path d="M 50 20 Q 230 -40 410 20" />
        <path d="M 170 20 Q 230 -10 290 20" />
        <path d="M 170 20 Q 290 -25 410 20" />
        <path d="M 290 20 Q 350 -10 410 20" />
      </g>

      <!-- Расширенное представление каждого слова (с контекстом) -->
      <g transform="translate(0, 110)">
        <rect x="0" y="0" width="100" height="36" rx="8" ry="8" fill="#26D9C9" opacity="0.85"/>
        <text x="50" y="23" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1117">мама+всё</text>

        <rect x="120" y="0" width="100" height="36" rx="8" ry="8" fill="#26D9C9" opacity="0.85"/>
        <text x="170" y="23" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1117">мыла+всё</text>

        <rect x="240" y="0" width="100" height="36" rx="8" ry="8" fill="#26D9C9" opacity="0.85"/>
        <text x="290" y="23" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1117">раму+всё</text>

        <rect x="360" y="0" width="100" height="36" rx="8" ry="8" fill="#26D9C9" opacity="0.85"/>
        <text x="410" y="23" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1117">…+всё</text>
      </g>

      <!-- Соединяющие линии -->
      <g stroke="#26D9C9" stroke-width="1" opacity="0.4">
        <line x1="50" y1="66" x2="50" y2="110"/>
        <line x1="170" y1="66" x2="170" y2="110"/>
        <line x1="290" y1="66" x2="290" y2="110"/>
        <line x1="410" y1="66" x2="410" y2="110"/>
      </g>
    </g>

    <!-- Плюсы -->
    <g transform="translate(40, 320)">
      <text x="0" y="0" font-size="14" font-weight="700" fill="#e6edf3">Плюсы:</text>

      <g transform="translate(0, 24)">
        <circle cx="6" cy="6" r="3" fill="#26D9C9"/>
        <text x="20" y="11" font-size="13" font-weight="500" fill="#8b949e">помнит всё что было — даже далеко в начале</text>
      </g>
      <g transform="translate(0, 48)">
        <circle cx="6" cy="6" r="3" fill="#26D9C9"/>
        <text x="20" y="11" font-size="13" font-weight="500" fill="#8b949e">обрабатывает все слова сразу — быстро</text>
      </g>
      <g transform="translate(0, 72)">
        <circle cx="6" cy="6" r="3" fill="#26D9C9"/>
        <text x="20" y="11" font-size="13" font-weight="500" fill="#8b949e">видеокарты загружены полностью</text>
      </g>
    </g>

    <line x1="30" y1="465" x2="510" y2="465" stroke="#30363d" stroke-width="1"/>
    <text x="270" y="492" text-anchor="middle" font-size="13" font-weight="600" fill="#26D9C9" opacity="0.8">
      Википедия: кликнул на ссылку — сразу в нужном разделе
    </text>
  </g>

</svg>
