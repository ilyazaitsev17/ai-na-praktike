<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

  <rect width="1200" height="740" fill="#0d1117"/>

  <text x="600" y="64" text-anchor="middle" font-size="40" font-weight="800" fill="#e6edf3">
    Q, K, V — библиотечный каталог
  </text>
  <text x="600" y="100" text-anchor="middle" font-size="17" font-weight="400" fill="#8b949e">
    как машина решает на что обратить внимание
  </text>

  <!-- ========== Q (Query) — слева ========== -->
  <g transform="translate(40, 150)">
    <rect x="0" y="0" width="320" height="200" rx="16" ry="16"
          fill="#161b22" stroke="#26D9C9" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="200" fill="#26D9C9"/>

    <text x="160" y="50" text-anchor="middle" font-size="44" font-weight="900" fill="#26D9C9">Q</text>
    <text x="160" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#26D9C9">QUERY · запрос</text>

    <line x1="40" y1="100" x2="280" y2="100" stroke="#30363d" stroke-width="1"/>

    <text x="160" y="135" text-anchor="middle" font-size="13" font-weight="500" fill="#8b949e">что я ищу</text>

    <g transform="translate(30, 152)">
      <rect x="0" y="0" width="260" height="36" rx="8" ry="8" fill="#0d1117" stroke="#26D9C9" stroke-width="1.5"/>
      <text x="130" y="23" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">«про мебельный бизнес»</text>
    </g>
  </g>

  <!-- Стрелка Q → K -->
  <g transform="translate(380, 240)">
    <line x1="0" y1="10" x2="36" y2="10" stroke="#26D9C9" stroke-width="2.5"/>
    <polyline points="28,2 38,10 28,18" fill="none" stroke="#26D9C9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="40" text-anchor="middle" font-size="11" font-weight="600" fill="#8b949e">сравнить</text>
  </g>

  <!-- ========== K (Key) — посередине ========== -->
  <g transform="translate(440, 150)">
    <rect x="0" y="0" width="320" height="380" rx="16" ry="16"
          fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="380" fill="#f0883e"/>

    <text x="160" y="50" text-anchor="middle" font-size="44" font-weight="900" fill="#f0883e">K</text>
    <text x="160" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#f0883e">KEY · ключи</text>

    <line x1="40" y1="100" x2="280" y2="100" stroke="#30363d" stroke-width="1"/>

    <text x="160" y="125" text-anchor="middle" font-size="13" font-weight="500" fill="#8b949e">ярлыки на карточках</text>

    <!-- Карточки ключей -->
    <g transform="translate(30, 145)">
      <!-- Совпавший — выделен -->
      <rect x="0" y="0" width="260" height="40" rx="8" ry="8" fill="#f0883e"/>
      <text x="130" y="25" text-anchor="middle" font-size="13" font-weight="800" fill="#0d1117">Производство мебели ✓</text>

      <rect x="0" y="52" width="260" height="40" rx="8" ry="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
      <text x="130" y="77" text-anchor="middle" font-size="13" font-weight="500" fill="#8b949e">Дизайн интерьера</text>

      <rect x="0" y="104" width="260" height="40" rx="8" ry="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
      <text x="130" y="129" text-anchor="middle" font-size="13" font-weight="500" fill="#8b949e">Маркетинг для дизайнеров</text>

      <rect x="0" y="156" width="260" height="40" rx="8" ry="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
      <text x="130" y="181" text-anchor="middle" font-size="13" font-weight="500" fill="#8b949e">История архитектуры</text>
    </g>
  </g>

  <!-- Стрелка K → V -->
  <g transform="translate(780, 240)">
    <line x1="0" y1="10" x2="36" y2="10" stroke="#f0883e" stroke-width="2.5"/>
    <polyline points="28,2 38,10 28,18" fill="none" stroke="#f0883e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="40" text-anchor="middle" font-size="11" font-weight="600" fill="#8b949e">взять</text>
  </g>

  <!-- ========== V (Value) — справа ========== -->
  <g transform="translate(840, 150)">
    <rect x="0" y="0" width="320" height="380" rx="16" ry="16"
          fill="#161b22" stroke="#56d364" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="380" fill="#56d364"/>

    <text x="160" y="50" text-anchor="middle" font-size="44" font-weight="900" fill="#56d364">V</text>
    <text x="160" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#56d364">VALUE · значение</text>

    <line x1="40" y1="100" x2="280" y2="100" stroke="#30363d" stroke-width="1"/>

    <text x="160" y="125" text-anchor="middle" font-size="13" font-weight="500" fill="#8b949e">сама книга с полки</text>

    <!-- Книга -->
    <g transform="translate(85, 150)">
      <rect x="0" y="0" width="150" height="200" rx="8" ry="8" fill="#56d364"/>
      <rect x="0" y="0" width="150" height="200" rx="8" ry="8" fill="none" stroke="#0d1117" stroke-width="2" stroke-opacity="0.3"/>
      <line x1="14" y1="20" x2="14" y2="180" stroke="#0d1117" stroke-width="1.5" stroke-opacity="0.4"/>

      <text x="82" y="80" text-anchor="middle" font-size="13" font-weight="800" fill="#0d1117">Производство</text>
      <text x="82" y="100" text-anchor="middle" font-size="13" font-weight="800" fill="#0d1117">мебели</text>

      <text x="82" y="135" text-anchor="middle" font-size="11" font-weight="600" fill="#0d1117" opacity="0.7">от лесопилки</text>
      <text x="82" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#0d1117" opacity="0.7">до магазина</text>
    </g>
  </g>

  <!-- ========== Нижняя плашка с расшифровкой ========== -->
  <g transform="translate(40, 580)">
    <rect x="0" y="0" width="1120" height="120" rx="16" ry="16"
          fill="#161b22" stroke="#30363d" stroke-width="1"/>

    <text x="40" y="40" font-size="16" font-weight="700" fill="#e6edf3">
      В трансформере каждое слово в предложении создаёт ВСЕ ТРИ копии — Q, K и V.
    </text>

    <g transform="translate(40, 60)">
      <circle cx="6" cy="20" r="3" fill="#26D9C9"/>
      <text x="20" y="25" font-size="14" font-weight="500" fill="#8b949e">
        Своим Q (запросом) каждое слово сравнивается с K (ключами) всех других слов
      </text>
    </g>

    <g transform="translate(40, 84)">
      <circle cx="6" cy="20" r="3" fill="#26D9C9"/>
      <text x="20" y="25" font-size="14" font-weight="500" fill="#8b949e">
        От тех слов, чьи ключи лучше всего подошли — берёт V (значения) и складывает в свой контекст
      </text>
    </g>
  </g>

</svg>
