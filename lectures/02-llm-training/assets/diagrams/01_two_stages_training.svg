<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

  <rect width="1200" height="720" fill="#0d1117"/>

  <text x="600" y="64" text-anchor="middle" font-size="40" font-weight="800" fill="#e6edf3">
    Две стадии обучения LLM
  </text>
  <text x="600" y="100" text-anchor="middle" font-size="17" font-weight="400" fill="#8b949e">
    как делают модели — от чистой статистики языка до полезного ассистента
  </text>

  <!-- СТАДИЯ 1: PRETRAINING -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="480" height="500" rx="20" ry="20"
          fill="#161b22" stroke="#26D9C9" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="500" fill="#26D9C9"/>

    <text x="240" y="56" text-anchor="middle" font-size="14" font-weight="700" fill="#8b949e" letter-spacing="2">
      СТАДИЯ 1
    </text>
    <text x="240" y="94" text-anchor="middle" font-size="32" font-weight="800" fill="#26D9C9">
      PRETRAINING
    </text>
    <text x="240" y="124" text-anchor="middle" font-size="15" font-weight="500" fill="#8b949e">
      учим машину тому что такое язык
    </text>

    <!-- Что делает -->
    <g transform="translate(40, 160)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#26D9C9" letter-spacing="1">ЧТО ДЕЛАЕТ</text>
      <text x="0" y="28" font-size="15" font-weight="500" fill="#e6edf3">предсказывает следующий токен</text>
      <text x="0" y="50" font-size="15" font-weight="500" fill="#e6edf3">по гигантскому объёму текста</text>
    </g>

    <!-- Данные -->
    <g transform="translate(40, 250)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#26D9C9" letter-spacing="1">ДАННЫЕ</text>
      <rect x="0" y="14" width="400" height="48" rx="8" ry="8"
            fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
      <text x="200" y="44" text-anchor="middle" font-size="22" font-weight="800" fill="#e6edf3">
        15 триллионов токенов
      </text>
    </g>

    <!-- Стоимость -->
    <g transform="translate(40, 340)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#26D9C9" letter-spacing="1">ЦЕНА</text>
      <rect x="0" y="14" width="400" height="48" rx="8" ry="8"
            fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
      <text x="200" y="44" text-anchor="middle" font-size="22" font-weight="800" fill="#f0883e">
        $60–190 миллионов
      </text>
    </g>

    <line x1="40" y1="450" x2="440" y2="450" stroke="#30363d" stroke-width="1"/>
    <text x="240" y="478" text-anchor="middle" font-size="13" font-weight="600" fill="#26D9C9" opacity="0.8">
      OpenAI · Anthropic · Google · Meta
    </text>
  </g>

  <!-- СТРЕЛКА -->
  <g transform="translate(560, 410)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#56d364" stroke-width="3"/>
    <polyline points="68,-10 80,0 68,10" fill="none" stroke="#56d364" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- СТАДИЯ 2: FINE-TUNING -->
  <g transform="translate(660, 160)">
    <rect x="0" y="0" width="480" height="500" rx="20" ry="20"
          fill="#161b22" stroke="#56d364" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="500" fill="#56d364"/>

    <text x="240" y="56" text-anchor="middle" font-size="14" font-weight="700" fill="#8b949e" letter-spacing="2">
      СТАДИЯ 2
    </text>
    <text x="240" y="94" text-anchor="middle" font-size="32" font-weight="800" fill="#56d364">
      FINE-TUNING
    </text>
    <text x="240" y="124" text-anchor="middle" font-size="15" font-weight="500" fill="#8b949e">
      учим модель помогать пользователю
    </text>

    <!-- Что делает -->
    <g transform="translate(40, 160)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#56d364" letter-spacing="1">ЧТО ДЕЛАЕТ</text>
      <text x="0" y="28" font-size="15" font-weight="500" fill="#e6edf3">учится отвечать на вопросы</text>
      <text x="0" y="50" font-size="15" font-weight="500" fill="#e6edf3">по парам «вход — эталонный ответ»</text>
    </g>

    <!-- Данные -->
    <g transform="translate(40, 250)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#56d364" letter-spacing="1">ДАННЫЕ</text>
      <rect x="0" y="14" width="400" height="48" rx="8" ry="8"
            fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
      <text x="200" y="44" text-anchor="middle" font-size="22" font-weight="800" fill="#e6edf3">
        10 миллионов примеров
      </text>
    </g>

    <!-- Стоимость -->
    <g transform="translate(40, 340)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#56d364" letter-spacing="1">ЦЕНА</text>
      <rect x="0" y="14" width="400" height="48" rx="8" ry="8"
            fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
      <text x="200" y="44" text-anchor="middle" font-size="22" font-weight="800" fill="#56d364">
        от десятков тысяч ₽
      </text>
    </g>

    <line x1="40" y1="450" x2="440" y2="450" stroke="#30363d" stroke-width="1"/>
    <text x="240" y="478" text-anchor="middle" font-size="13" font-weight="600" fill="#56d364" opacity="0.8">
      доступно небольшим командам и одиночкам
    </text>
  </g>

</svg>
