<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

  <rect width="1200" height="720" fill="#0d1117"/>

  <text x="600" y="64" text-anchor="middle" font-size="40" font-weight="800" fill="#e6edf3">
    Закон Шиншиллы
  </text>
  <text x="600" y="100" text-anchor="middle" font-size="17" font-weight="400" fill="#8b949e">
    оптимальное соотношение параметров модели и данных для обучения
  </text>

  <!-- ЦЕНТРАЛЬНАЯ ФОРМУЛА -->
  <g transform="translate(280, 150)">
    <rect x="0" y="0" width="640" height="130" rx="16" ry="16"
          fill="#161b22" stroke="#26D9C9" stroke-width="2"/>
    <text x="320" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#26D9C9" letter-spacing="2">
      ОПТИМУМ
    </text>
    <g transform="translate(0, 100)">
      <text x="70" y="0" font-size="42" font-weight="800" fill="#e6edf3">1</text>
      <text x="105" y="0" font-size="24" font-weight="500" fill="#8b949e">параметр</text>
      <text x="295" y="0" text-anchor="middle" font-size="40" font-weight="800" fill="#26D9C9">→</text>
      <text x="345" y="0" font-size="42" font-weight="800" fill="#e6edf3">20</text>
      <text x="410" y="0" font-size="24" font-weight="500" fill="#8b949e">токенов</text>
    </g>
  </g>

  <!-- GPT-3 (НЕДОКОРМЛЕННАЯ) -->
  <g transform="translate(80, 320)">
    <rect x="0" y="0" width="500" height="340" rx="20" ry="20"
          fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="340" fill="#f0883e"/>

    <text x="250" y="48" text-anchor="middle" font-size="26" font-weight="800" fill="#f0883e">
      GPT-3 · 2020
    </text>
    <text x="250" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="#8b949e">
      классика — недокормленная модель
    </text>

    <g transform="translate(40, 110)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#8b949e" letter-spacing="1">ПАРАМЕТРЫ</text>
      <text x="0" y="32" font-size="26" font-weight="800" fill="#e6edf3">175 млрд</text>
    </g>

    <g transform="translate(260, 110)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#8b949e" letter-spacing="1">ТОКЕНОВ В ОБУЧЕНИИ</text>
      <text x="0" y="32" font-size="26" font-weight="800" fill="#e6edf3">300 млрд</text>
    </g>

    <g transform="translate(40, 210)">
      <rect x="0" y="0" width="420" height="68" rx="10" ry="10" fill="#0d1117" stroke="#f0883e" stroke-width="1.5"/>
      <text x="210" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#f0883e" letter-spacing="1">
        СООТНОШЕНИЕ
      </text>
      <text x="210" y="58" text-anchor="middle" font-size="22" font-weight="800" fill="#f0883e">
        1 к 1.7 · в 12 раз меньше нормы
      </text>
    </g>

    <text x="250" y="312" text-anchor="middle" font-size="13" font-weight="600" fill="#f0883e" opacity="0.85">
      ресурс модели потрачен зря — данных не хватило
    </text>
  </g>

  <!-- LLAMA 3 (ОПТИМУМ+) -->
  <g transform="translate(620, 320)">
    <rect x="0" y="0" width="500" height="340" rx="20" ry="20"
          fill="#161b22" stroke="#56d364" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="340" fill="#56d364"/>

    <text x="250" y="48" text-anchor="middle" font-size="26" font-weight="800" fill="#56d364">
      Llama 3 · 2024
    </text>
    <text x="250" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="#8b949e">
      современный подход — перекармливают сознательно
    </text>

    <g transform="translate(40, 110)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#8b949e" letter-spacing="1">ПАРАМЕТРЫ</text>
      <text x="0" y="32" font-size="26" font-weight="800" fill="#e6edf3">405 млрд</text>
    </g>

    <g transform="translate(260, 110)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#8b949e" letter-spacing="1">ТОКЕНОВ В ОБУЧЕНИИ</text>
      <text x="0" y="32" font-size="26" font-weight="800" fill="#e6edf3">15 трлн</text>
    </g>

    <g transform="translate(40, 210)">
      <rect x="0" y="0" width="420" height="68" rx="10" ry="10" fill="#0d1117" stroke="#56d364" stroke-width="1.5"/>
      <text x="210" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#56d364" letter-spacing="1">
        СООТНОШЕНИЕ
      </text>
      <text x="210" y="58" text-anchor="middle" font-size="22" font-weight="800" fill="#56d364">
        1 к 37 · даже больше нормы
      </text>
    </g>

    <text x="250" y="312" text-anchor="middle" font-size="13" font-weight="600" fill="#56d364" opacity="0.85">
      инвестировали в качество — модель сильнее своего размера
    </text>
  </g>

</svg>
