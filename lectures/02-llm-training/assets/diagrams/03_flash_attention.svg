<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

  <rect width="1200" height="720" fill="#0d1117"/>

  <text x="600" y="64" text-anchor="middle" font-size="40" font-weight="800" fill="#e6edf3">
    Flash Attention
  </text>
  <text x="600" y="100" text-anchor="middle" font-size="17" font-weight="400" fill="#8b949e">
    почему два типа памяти GPU решают скорость обучения
  </text>

  <!-- HBM (далёкий склад) -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="480" height="500" rx="20" ry="20"
          fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="500" fill="#f0883e"/>

    <text x="240" y="56" text-anchor="middle" font-size="14" font-weight="700" fill="#8b949e" letter-spacing="2">
      ДАЛЁКИЙ СКЛАД
    </text>
    <text x="240" y="98" text-anchor="middle" font-size="36" font-weight="800" fill="#f0883e">
      HBM
    </text>
    <text x="240" y="124" text-anchor="middle" font-size="14" font-weight="500" fill="#8b949e">
      High Bandwidth Memory
    </text>

    <!-- Большая коробка склада -->
    <g transform="translate(60, 160)">
      <rect x="0" y="0" width="360" height="160" rx="12" ry="12"
            fill="#0d1117" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="6,4"/>
      <g opacity="0.5">
        <rect x="20" y="20" width="50" height="50" rx="4" fill="#f0883e" opacity="0.3"/>
        <rect x="80" y="20" width="50" height="50" rx="4" fill="#f0883e" opacity="0.3"/>
        <rect x="140" y="20" width="50" height="50" rx="4" fill="#f0883e" opacity="0.3"/>
        <rect x="200" y="20" width="50" height="50" rx="4" fill="#f0883e" opacity="0.3"/>
        <rect x="260" y="20" width="50" height="50" rx="4" fill="#f0883e" opacity="0.3"/>
        <rect x="20" y="80" width="50" height="50" rx="4" fill="#f0883e" opacity="0.3"/>
        <rect x="80" y="80" width="50" height="50" rx="4" fill="#f0883e" opacity="0.3"/>
        <rect x="140" y="80" width="50" height="50" rx="4" fill="#f0883e" opacity="0.3"/>
        <rect x="200" y="80" width="50" height="50" rx="4" fill="#f0883e" opacity="0.3"/>
        <rect x="260" y="80" width="50" height="50" rx="4" fill="#f0883e" opacity="0.3"/>
      </g>
    </g>

    <!-- Размер -->
    <g transform="translate(60, 350)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#f0883e" letter-spacing="1">РАЗМЕР</text>
      <text x="0" y="32" font-size="32" font-weight="800" fill="#e6edf3">80 ГБ</text>
    </g>

    <!-- Скорость -->
    <g transform="translate(260, 350)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#f0883e" letter-spacing="1">СКОРОСТЬ</text>
      <text x="0" y="32" font-size="32" font-weight="800" fill="#e6edf3">3 ТБ/с</text>
    </g>

    <line x1="40" y1="450" x2="440" y2="450" stroke="#30363d" stroke-width="1"/>
    <text x="240" y="478" text-anchor="middle" font-size="13" font-weight="600" fill="#f0883e" opacity="0.85">
      места много · ходить долго
    </text>
  </g>

  <!-- SRAM (ближний стеллаж) -->
  <g transform="translate(660, 160)">
    <rect x="0" y="0" width="480" height="500" rx="20" ry="20"
          fill="#161b22" stroke="#26D9C9" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="500" fill="#26D9C9"/>

    <text x="240" y="56" text-anchor="middle" font-size="14" font-weight="700" fill="#8b949e" letter-spacing="2">
      СТЕЛЛАЖ У СТАНКА
    </text>
    <text x="240" y="98" text-anchor="middle" font-size="36" font-weight="800" fill="#26D9C9">
      SRAM
    </text>
    <text x="240" y="124" text-anchor="middle" font-size="14" font-weight="500" fill="#8b949e">
      Static Random Access Memory
    </text>

    <!-- Маленький стеллаж -->
    <g transform="translate(60, 160)">
      <rect x="0" y="0" width="360" height="160" rx="12" ry="12"
            fill="#0d1117" stroke="#26D9C9" stroke-width="1.5" stroke-dasharray="6,4"/>
      <g transform="translate(140, 50)">
        <rect x="0" y="0" width="35" height="35" rx="4" fill="#26D9C9"/>
        <rect x="45" y="0" width="35" height="35" rx="4" fill="#26D9C9"/>
      </g>
    </g>

    <!-- Размер -->
    <g transform="translate(60, 350)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#26D9C9" letter-spacing="1">РАЗМЕР</text>
      <text x="0" y="32" font-size="32" font-weight="800" fill="#e6edf3">~20 МБ</text>
    </g>

    <!-- Скорость -->
    <g transform="translate(260, 350)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#26D9C9" letter-spacing="1">СКОРОСТЬ</text>
      <text x="0" y="32" font-size="32" font-weight="800" fill="#26D9C9">30 ТБ/с</text>
    </g>

    <line x1="40" y1="450" x2="440" y2="450" stroke="#30363d" stroke-width="1"/>
    <text x="240" y="478" text-anchor="middle" font-size="13" font-weight="600" fill="#26D9C9" opacity="0.85">
      места мало · в 10 раз быстрее
    </text>
  </g>

  <!-- Идея Flash Attention внизу-->
  <g transform="translate(60, 685)" opacity="0">
    <text font-size="14" fill="#8b949e">placeholder</text>
  </g>

</svg>
