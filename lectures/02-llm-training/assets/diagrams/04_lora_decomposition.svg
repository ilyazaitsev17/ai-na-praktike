<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

  <rect width="1200" height="720" fill="#0d1117"/>

  <text x="600" y="64" text-anchor="middle" font-size="40" font-weight="800" fill="#e6edf3">
    LoRA — ремонт без сноса стен
  </text>
  <text x="600" y="100" text-anchor="middle" font-size="17" font-weight="400" fill="#8b949e">
    дообучаем модель малым числом параметров — на 2-3 порядка дешевле полного fine-tuning
  </text>

  <!-- Полные веса W -->
  <g transform="translate(80, 200)">
    <text x="140" y="-20" text-anchor="middle" font-size="14" font-weight="700" fill="#8b949e" letter-spacing="2">
      ПОЛНЫЕ ВЕСА МОДЕЛИ
    </text>

    <rect x="0" y="0" width="280" height="280" rx="12" ry="12"
          fill="#26D9C9" stroke="#26D9C9" stroke-width="2" opacity="0.95"/>
    <text x="140" y="155" text-anchor="middle" font-size="64" font-weight="800" fill="#0d1117">
      W
    </text>

    <!-- Подписи размеров -->
    <text x="-20" y="145" text-anchor="end" font-size="18" font-weight="700" fill="#8b949e">d</text>
    <text x="140" y="312" text-anchor="middle" font-size="18" font-weight="700" fill="#8b949e">k</text>

    <text x="140" y="340" text-anchor="middle" font-size="14" font-weight="500" fill="#8b949e">
      миллиарды параметров
    </text>
  </g>

  <!-- Знак ≈ -->
  <text x="420" y="350" text-anchor="middle" font-size="64" font-weight="400" fill="#8b949e">≈</text>

  <!-- W0 (замороженная) -->
  <g transform="translate(470, 200)">
    <text x="140" y="-20" text-anchor="middle" font-size="14" font-weight="700" fill="#8b949e" letter-spacing="2">
      ЗАМОРОЖЕНО
    </text>

    <rect x="0" y="0" width="280" height="280" rx="12" ry="12"
          fill="#21262d" stroke="#30363d" stroke-width="2"/>
    <text x="140" y="148" text-anchor="middle" font-size="56" font-weight="800" fill="#8b949e">
      W₀
    </text>
    <text x="140" y="180" text-anchor="middle" font-size="14" font-weight="500" fill="#8b949e">
      не тренируется
    </text>

    <text x="140" y="340" text-anchor="middle" font-size="14" font-weight="500" fill="#8b949e">
      исходные веса модели
    </text>
  </g>

  <!-- Знак + -->
  <text x="810" y="350" text-anchor="middle" font-size="64" font-weight="400" fill="#56d364">+</text>

  <!-- B × A (тренируемые) -->
  <g transform="translate(870, 200)">
    <text x="125" y="-20" text-anchor="middle" font-size="14" font-weight="700" fill="#56d364" letter-spacing="2">
      ТРЕНИРУЕМ
    </text>

    <!-- B: высокая узкая -->
    <rect x="0" y="0" width="36" height="280" rx="6" ry="6"
          fill="#56d364" opacity="0.95"/>
    <text x="18" y="155" text-anchor="middle" font-size="32" font-weight="800" fill="#0d1117">
      B
    </text>
    <text x="18" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="#8b949e">r</text>

    <!-- Знак × -->
    <text x="65" y="155" text-anchor="middle" font-size="28" font-weight="500" fill="#56d364">×</text>

    <!-- A: широкая низкая -->
    <rect x="90" y="122" width="220" height="36" rx="6" ry="6"
          fill="#56d364" opacity="0.95"/>
    <text x="200" y="148" text-anchor="middle" font-size="24" font-weight="800" fill="#0d1117">
      A
    </text>
    <text x="82" y="148" text-anchor="end" font-size="14" font-weight="700" fill="#8b949e">r</text>

    <text x="155" y="340" text-anchor="middle" font-size="14" font-weight="500" fill="#56d364">
      на 100-1000× меньше параметров
    </text>
  </g>

  <!-- Нижняя плашка с выводом -->
  <g transform="translate(80, 580)">
    <rect x="0" y="0" width="1040" height="100" rx="16" ry="16"
          fill="#161b22" stroke="#26D9C9" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="100" fill="#26D9C9"/>

    <text x="40" y="42" font-size="15" font-weight="700" fill="#26D9C9" letter-spacing="1">
      ГЛАВНОЕ
    </text>
    <text x="40" y="74" font-size="20" font-weight="500" fill="#e6edf3">
      ранг r &lt;&lt; d, k · обучаем единицы процентов от модели · базовая модель одна на все задачи
    </text>
  </g>

</svg>
